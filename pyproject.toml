[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant"
version = "0.1.0"
description = "日频量化因子研究、本地行情服务与大 QMT 数据落盘工具"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# 三个子包的公共依赖。qmt_downloader 只使用 pandas，其余依赖按 extras 安装。
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
# 因子研究：数据集构建、模型训练与报告
research = [
    "pyarrow>=14.0",
    # 1.1 起才有三参 arg_min(arg, val, n)，日线入库靠它抽过滤样例；1.0 会直接
    # 抛 BinderException 让整次分片重写失败。这里只标定该算子的可用下限（实测
    # 1.0.0 报错、1.1.0 可用），不代表整套测试在 1.1 上跑得通——pip 默认装最新版，
    # 实际验证跑在当前最新的 1.5.x 上。
    "duckdb>=1.1",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "PyYAML>=6.0",
]
# 本地行情服务：HTTP 接口与网页
service = [
    # 与 research 同一下限，原因见上。
    "duckdb>=1.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
# 分钟行情下载（同花顺 iFinD），需另行安装官方 SDK iFinDAPI
ifind = [
    "pyarrow>=14.0",
]
# 开发工具链
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
quant-build-daily-store = "quant.cli.build_daily_store:main"
quant-factor-demo = "quant.cli.factor_demo:main"
quant-grid-search = "quant.cli.grid_search:main"
quant-market-check = "quant.cli.market_check:main"
quant-market-server = "quant.cli.market_server:main"
quant-qmt-self-check = "quant.cli.qmt_self_check:main"
quant-single-factor-test = "quant.cli.single_factor_test:main"
quant-ifind-download = "quant.cli.ifind_download:main"
quant-build-market-db = "quant.market_data.build_database:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quant.market_data" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["default"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# qmt_downloader 需在大 QMT 内置 Python 中运行，不能使用较新的语法糖，
# 因此单独放宽规则，见下方 per-file-ignores。
extend-exclude = [".venv", "logs", "output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # 行宽由 formatter 控制，历史长行不逐条改写
    "B008",   # FastAPI 依赖注入需要在默认值中调用 Query()

    # 以下为存量代码的待办清单（棘轮）：规则本身有价值，但修复需要改动业务
    # 逻辑，不能与结构重构混在一起。新增代码应主动遵守，后续按模块逐条摘除。
    "B023",   # 闭包引用循环变量；已逐处核查，当前 2 处均在同一次迭代内消费，无实际缺陷
    "B027",   # 抽象基类中的空方法未加 @abstractmethod
    "B904",   # except 中 raise 未写 from
    "B905",   # zip 未显式指定 strict
    "C401",   # 可用集合推导替代生成器
    "C416",   # 冗余推导式
    "E731",   # 用 lambda 赋值代替 def
    "SIM105", # 可用 contextlib.suppress
    "SIM108", # 可用三元表达式
    "SIM117", # 可合并的嵌套 with
    "UP030",  # format 位置参数可省略序号
    "UP031",  # 百分号格式化可改为 f-string
]

[tool.ruff.lint.per-file-ignores]
# 大 QMT 内置 Python 版本较旧，禁止 pyupgrade 把兼容写法改成新语法。
# 只豁免真正位于 QMT 导入链上的模块；self_check 包只在外部 Python 运行，
# 仍需遵守全部现代化规则，因此不在此列。
"src/quant/qmt_downloader/*.py" = ["UP"]
"src/quant/qmt_downloader/runner/*.py" = ["UP"]
# 大 QMT 策略入口的特殊约束（下载器入口与交易日历导出入口都在大 QMT 中运行）：
# E402 必须先注入 sys.path 再导入 quant，导入不能提到文件顶部；
# F821 download_history_data 由大 QMT 运行时注入，静态分析看不到；
# I001 导入顺序受上述两点约束，不能重排。
"scripts/qmt_*.py" = ["UP", "E402", "F821", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["quant"]

[tool.mypy]
python_version = "3.11"
files = ["src/quant"]
ignore_missing_imports = true
# 存量代码尚未全量标注，先只保证新增标注自洽，后续再逐包收紧。
check_untyped_defs = false
warn_unused_configs = true
