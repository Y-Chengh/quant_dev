name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装项目及开发依赖
        run: python -m pip install -e ".[research,service,dev]"

      - name: 静态检查
        run: python -m ruff check .

      - name: 全量测试
        run: python -m pytest -q

      - name: 类型检查
        # 存量代码尚未全量标注，先不阻断流水线。
        continue-on-error: true
        run: python -m mypy
