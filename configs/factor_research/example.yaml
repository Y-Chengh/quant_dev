# 命令行参数会覆盖本文件中的同名配置。
# python -m quant.cli.factor_demo --config configs/factor_research/example.yaml

# 数据集设置
start: 2018-01-01
end: 2023-01-01
validation_start: 2022-01-01
symbol_limit: 500

training_mode: single  # rolling: 逐日扩展训练；single: 固定训练集只训练一次

# 回测费用
backtest_top_n: 10
slippage_bps: 3
commission_bps: 1
# 训练样本按目标持有期检查买卖可执行性；无法判定时保留，只剔除明确涨跌停或停牌。
training_sample_filters:
  - limit_up_buy
  - limit_down_sell
training_sample_filter_missing_policy: allow

# 模型设置
task: regression
label_return_threshold: 0.005  # classification 正类阈值；严格大于 0.5% 时标签为 1

# model: logistic_regression
# regression_alpha: 1.0

model: lightgbm
objective: huber
objective_alpha: 0.02  # Huber 截断阈值；收益率以小数表示，0.02 即 2%
# boosting_type: gbdt  # 缺省 dart；gbdt 训练快数倍，goss 更快但要求 subsample: 1.0
n_estimators: 1000
learning_rate:  0.03
num_leaves: 31
max_depth: 5
min_child_samples: 50
subsample: 0.8
colsample_bytree: 0.8
reg_alpha: 0.1
reg_lambda: 1.0


no_factor_cache: false
log_level: INFO

# 因子设置
factors:
  # - amplitude
  - breakout_strength_20d
  - close_position
  # - close_to_ma_5d
  # - intraday_return
  # - last_30m_return
  - last_30m_volume_ratio
  # - ma_5d_slope
  # - ma_distance_change_5d 
  # - ma_spread_5d_20d
  # - ma_spread_change_5d_20d
  # - momentum_acceleration_5d_20d
  - positive_bar_ratio
  # - realized_vol
  - return_10d
  - return_1d
  # - return_20d
  # - return_5d
  # - up_days_ratio_5d
  - volatility_5d
  - volume_ratio_5d
  - candle_body_ratio
  - alpha_002
  - alpha_001

factor_expressions:
  - ts_rank(column(close),min_periods=20,window=20)
  - ts_rank(cs_zscore(column(close)),min_periods=20,window=20)
  - ts_rank(add(column(low),ts_rank(column(close),min_periods=5,window=5)),min_periods=20,window=20)
  - multiply(subtract(column(low),column(close)),ts_stddev(subtract(column(low),column(close)),ddof=0,min_periods=10,window=10))
  # - multiply(subtract(column(low),column(close)),ts_stddev(column(high),ddof=0,min_periods=20,window=20))
  # - subtract(column(low),column(close))
